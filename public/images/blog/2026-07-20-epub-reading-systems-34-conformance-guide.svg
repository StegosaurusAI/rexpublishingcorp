<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EPUB Reading Systems 3.4 QA checklist</title>
  <desc id="desc">Four test lanes: layout, processing and fallbacks, network access, and accessibility controls. The July 21, 2026 Candidate Recommendation Draft is a work in progress, not proof of app support.</desc>
  <rect width="1200" height="630" fill="#102d3b"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="70" fill="white" font-size="20">REX PUBLISHING · DIGITAL PUBLISHING</text>
    <text x="64" y="142" fill="white" font-size="42" font-weight="700">EPUB Reading Systems 3.4</text>
    <text x="64" y="186" fill="#d9e8ed" font-size="24">Draft guidance becomes useful through actual QA evidence.</text>
    <g fill="#f4f7f5">
      <rect x="64" y="242" width="520" height="128" rx="12"/>
      <rect x="616" y="242" width="520" height="128" rx="12"/>
      <rect x="64" y="402" width="520" height="128" rx="12"/>
      <rect x="616" y="402" width="520" height="128" rx="12"/>
    </g>
    <g fill="#102d3b">
      <text x="88" y="284" font-size="28" font-weight="700">Layout</text>
      <text x="88" y="330" font-size="22">Record behavior in the target app.</text>
      <text x="640" y="284" font-size="28" font-weight="700">Processing and fallbacks</text>
      <text x="640" y="330" font-size="22">Check the applicable resource rules.</text>
      <text x="88" y="444" font-size="28" font-weight="700">Network access</text>
      <text x="88" y="490" font-size="22">Observe what works when offline.</text>
      <text x="640" y="444" font-size="28" font-weight="700">Accessibility controls</text>
      <text x="640" y="490" font-size="22">Test navigation, search and display.</text>
    </g>
    <text x="64" y="584" fill="#d9e8ed" font-size="20">Rex QA guidance · Specification status does not establish app support.</text>
  </g>
</svg>
