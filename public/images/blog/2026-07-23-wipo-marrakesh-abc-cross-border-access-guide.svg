<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WIPO Marrakesh Treaty and ABC 2026 checkpoint</title>
  <desc id="desc">A Rex Publishing chart showing the March 30, 2026 treaty baseline, the July 13, 2026 assembly update, and the scale of the Accessible Books Consortium catalogue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="154" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Marrakesh + ABC checkpoint
  </text>
  <text x="118" y="208" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Treaty growth is useful only when access tools and implementation keep up
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="286" width="368" height="238" rx="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <text x="154" y="350" fill="#0c4a6e" font-size="32" font-weight="700">March 30, 2026 baseline</text>
    <text x="154" y="408" fill="#075985" font-size="66" font-weight="700">103</text>
    <text x="290" y="408" fill="#075985" font-size="28">Contracting Parties</text>
    <text x="154" y="454" fill="#0f766e" font-size="54" font-weight="700">129</text>
    <text x="290" y="454" fill="#0f766e" font-size="28">WIPO Member States covered</text>
    <text x="154" y="496" fill="#155e75" font-size="24">Formal status document presented to the July assembly</text>

    <rect x="526" y="286" width="368" height="238" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="562" y="350" fill="#14532d" font-size="32" font-weight="700">July 13, 2026 update</text>
    <text x="562" y="408" fill="#166534" font-size="28">New parties since prior session:</text>
    <text x="562" y="448" fill="#166534" font-size="34" font-weight="700">Albania, Angola, Cuba, Mozambique</text>
    <text x="562" y="494" fill="#166534" font-size="24">Niger said it was ready to deposit its instrument.</text>

    <rect x="934" y="286" width="482" height="238" rx="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <text x="970" y="350" fill="#4c1d95" font-size="32" font-weight="700">ABC operating scale</text>
    <text x="970" y="410" fill="#5b21b6" font-size="66" font-weight="700">1.2M+</text>
    <text x="1180" y="410" fill="#5b21b6" font-size="28">accessible books</text>
    <text x="970" y="456" fill="#6d28d9" font-size="54" font-weight="700">80</text>
    <text x="1080" y="456" fill="#6d28d9" font-size="28">languages</text>
    <text x="970" y="498" fill="#5b21b6" font-size="24">Beneficiary Application and Dolphin EasyReader enable direct-user access.</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="584" width="1298" height="160" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="644" fill="#0f172a" font-size="34" font-weight="700">What matters operationally</text>
    <text x="154" y="694" fill="#334155" font-size="28">Treaty accession widens the legal framework.</text>
    <text x="664" y="694" fill="#334155" font-size="28">ABC tools improve cross-border delivery.</text>
    <text x="1092" y="694" fill="#334155" font-size="28">Implementation still decides the reader outcome.</text>
  </g>
</svg>
