<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NORLA 2025 translation subsidy market guide</title>
  <desc id="desc">A Rex Publishing market graphic showing 478 grants across 53 languages, 502 applications, the leading language markets, and the October 1, 2026 NORLA filing deadline.</desc>
  <rect width="1200" height="630" fill="#F6F1E8"/>
  <rect x="34" y="34" width="1132" height="562" rx="28" fill="#FFFDFC" stroke="#D6C5A8" stroke-width="4"/>
  <text x="84" y="112" fill="#1F3B2F" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Rex Publishing</text>
  <text x="84" y="160" fill="#6B4F2A" font-family="Arial, Helvetica, sans-serif" font-size="22">NORLA 2025 translation-subsidy signal</text>
  <text x="84" y="230" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">478 grants</text>
  <text x="84" y="268" fill="#4B5563" font-family="Arial, Helvetica, sans-serif" font-size="24">across 53 languages from 502 applications</text>
  <rect x="84" y="312" width="472" height="196" rx="22" fill="#F2E7D6"/>
  <text x="112" y="354" fill="#6B4F2A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Leading languages named by NORLA</text>
  <text x="112" y="398" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="28">1. German</text>
  <text x="112" y="432" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="28">2. Swedish</text>
  <text x="112" y="466" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="28">3. Danish</text>
  <text x="320" y="398" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="28">4. Italian</text>
  <text x="320" y="432" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="28">5. Arabic</text>
  <text x="320" y="466" fill="#4B5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Plus French, Spanish, Dutch, Serbian, Croatian</text>
  <rect x="600" y="188" width="504" height="152" rx="22" fill="#E3EFE8"/>
  <text x="628" y="230" fill="#1F3B2F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Category mix</text>
  <text x="628" y="276" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="30">138 children's and YA</text>
  <text x="628" y="312" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="30">28 illustrated non-fiction</text>
  <text x="628" y="348" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="30">78 picture books</text>
  <rect x="600" y="374" width="504" height="134" rx="22" fill="#1F3B2F"/>
  <text x="628" y="418" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Live workflow hook</text>
  <text x="628" y="458" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Next deadline: October 1, 2026</text>
  <text x="628" y="492" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="22">Translator contract, CV, pre-publication filing, NOK request</text>
  <text x="84" y="558" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="22">Grant activity is a market signal, not a retail-sales ranking.</text>
</svg>
