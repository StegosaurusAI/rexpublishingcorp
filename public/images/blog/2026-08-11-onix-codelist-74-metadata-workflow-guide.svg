<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ONIX Codelist 74 workflow review card</title>
  <desc id="desc">Workflow guide card for ONIX Codelist 74 showing new human-authorship link fields, a hybrid physical-and-digital product code, new dual and duet audiobook labels, and accessibility-note updates for publishing metadata teams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6efe4"/>
      <stop offset="100%" stop-color="#dce9e3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="110" y="88" width="1380" height="724" rx="34" fill="#fffaf2" stroke="#cbd5e1" stroke-width="2"/>

  <text x="180" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#17324d">ONIX Codelist 74</text>
  <text x="180" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#475569">Small standards update, immediate workflow review.</text>

  <g filter="url(#shadow)">
    <rect x="180" y="286" width="560" height="170" rx="28" fill="#17324d"/>
    <text x="220" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#f8fafc">List 73</text>
    <text x="220" y="394" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#dbeafe">AI-authorship links</text>
    <text x="220" y="432" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#dbeafe">Codes 55 and 56 point to certification or declaration pages.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="286" width="560" height="170" rx="28" fill="#164e63"/>
    <text x="900" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#ecfeff">List 150</text>
    <text x="900" y="394" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#cffafe">Hybrid retail products</text>
    <text x="900" y="432" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#cffafe">Cleaner code path for products mixing physical and digital parts.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="506" width="560" height="170" rx="28" fill="#365314"/>
    <text x="220" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#f7fee7">List 81</text>
    <text x="220" y="614" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#dcfce7">Dual and duet audiobooks</text>
    <text x="220" y="652" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#dcfce7">Better structured labeling for distinct narration formats.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="506" width="560" height="170" rx="28" fill="#7c2d12"/>
    <text x="900" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#fff7ed">Lists 81 and 196</text>
    <text x="900" y="614" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#ffedd5">Accessibility note review</text>
    <text x="900" y="652" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#ffedd5">Re-read note text, not just the code names.</text>
  </g>

  <rect x="180" y="724" width="1240" height="42" rx="21" fill="#17324d"/>
  <text x="220" y="752" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#f8fafc">Legacy warning: BookNet Canada says the ONIX 2.1 dataset is planned for decommission in October 2026.</text>
</svg>
