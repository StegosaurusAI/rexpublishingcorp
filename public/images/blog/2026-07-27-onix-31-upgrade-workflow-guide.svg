<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ONIX 3.1 upgrade checklist</title>
  <desc id="desc">A checklist graphic showing the practical steps to move from ONIX 3.0 to ONIX 3.1 without treating it like a full migration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="56" y="56" width="1488" height="788" rx="32" fill="#fffefc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="120" y="156" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">ONIX 3.1 upgrade workflow</text>
  <text x="120" y="210" fill="#475569" font-family="Arial, sans-serif" font-size="28">For teams already on ONIX 3.0, this is usually cleanup first and a header switch second</text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="292" width="260" height="190" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="154" y="356" fill="#1e3a8a" font-size="34" font-weight="700">1. Remove baggage</text>
    <text x="154" y="402" fill="#1d4ed8" font-size="24">Replace old</text>
    <text x="154" y="434" fill="#1d4ed8" font-size="24">deprecated elements</text>
    <text x="154" y="466" fill="#1d4ed8" font-size="24">with modern forms</text>

    <rect x="410" y="292" width="260" height="190" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="444" y="356" fill="#14532d" font-size="34" font-weight="700">2. Fix structure</text>
    <text x="444" y="402" fill="#166534" font-size="24">Drop Gender and</text>
    <text x="444" y="434" fill="#166534" font-size="24">correct the old</text>
    <text x="444" y="466" fill="#166534" font-size="24">SalesRestriction and</text>
    <text x="444" y="498" fill="#166534" font-size="24">UnnamedPersons positions</text>

    <rect x="700" y="292" width="260" height="190" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="734" y="356" fill="#78350f" font-size="34" font-weight="700">3. Test as 3.0</text>
    <text x="734" y="402" fill="#92400e" font-size="24">Keep the cleaned</text>
    <text x="734" y="434" fill="#92400e" font-size="24">feed valid as ONIX 3.0</text>
    <text x="734" y="466" fill="#92400e" font-size="24">while partners verify</text>

    <rect x="990" y="292" width="260" height="190" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="1024" y="356" fill="#7f1d1d" font-size="34" font-weight="700">4. Switch header</text>
    <text x="1024" y="402" fill="#991b1b" font-size="24">Update the</text>
    <text x="1024" y="434" fill="#991b1b" font-size="24">release and xmlns</text>
    <text x="1024" y="466" fill="#991b1b" font-size="24">attributes in</text>
    <text x="1024" y="498" fill="#991b1b" font-size="24">ONIXMessage</text>

    <rect x="1280" y="292" width="180" height="190" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <text x="1314" y="356" fill="#4c1d95" font-size="34" font-weight="700">5. Add later</text>
    <text x="1314" y="402" fill="#5b21b6" font-size="24">Treat new 3.1</text>
    <text x="1314" y="434" fill="#5b21b6" font-size="24">features as a</text>
    <text x="1314" y="466" fill="#5b21b6" font-size="24">separate roadmap</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M380 386 H398"/>
    <path d="M670 386 H688"/>
    <path d="M960 386 H978"/>
    <path d="M1250 386 H1268"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="120" y="610" fill="#0f172a" font-size="34" font-weight="700">Keep the claim narrow</text>
    <text x="120" y="664" fill="#334155" font-size="28">This is the practical path for organizations already sending ONIX 3.0.</text>
    <text x="120" y="718" fill="#334155" font-size="28">It is not the same as escaping lingering ONIX 2.1 supply-chain dependencies.</text>
    <text x="120" y="772" fill="#334155" font-size="28">Current standards layer: ONIX 3.1.3 with Codelist Issue 73, cited from EDItEUR by BIC media.</text>
  </g>
</svg>
