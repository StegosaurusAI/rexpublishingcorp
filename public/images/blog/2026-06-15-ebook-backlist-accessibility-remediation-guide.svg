<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Backlist accessibility: decide the next action</title><desc id="desc">Three fictional records: File A goes to repair sampling, File B to specialist assessment, and File C to source investigation. Each needs an owner, an unresolved question and a review point. These are planning lanes, not conformance results.</desc><rect width="1600" height="900" fill="#f3f1e9"/><g font-family="Arial, sans-serif" fill="#183c3b"><text x="90" y="110" font-size="28" letter-spacing="4">REX PUBLISHING / DIGITAL WORKFLOWS</text><text x="90" y="205" font-size="62" font-weight="700">Decide the next action.</text><text x="90" y="270" font-size="32">A backlist register before a repair commission</text></g><g fill="#fff" stroke="#183c3b" stroke-width="3"><rect x="90" y="340" width="450" height="300" rx="18"/><rect x="575" y="340" width="450" height="300" rx="18"/><rect x="1060" y="340" width="450" height="300" rx="18"/></g><g font-family="Arial, sans-serif" fill="#183c3b"><g font-size="29" letter-spacing="2"><text x="125" y="400">FICTIONAL FILE A</text><text x="610" y="400">FICTIONAL FILE B</text><text x="1095" y="400">FICTIONAL FILE C</text></g><g font-size="38" font-weight="700"><text x="125" y="475">Repair sampling</text><text x="610" y="475">Specialist</text><text x="610" y="522">assessment</text><text x="1095" y="475">Source</text><text x="1095" y="522">investigation</text></g><g font-size="27"><text x="125" y="585">Define the repair boundary</text><text x="610" y="585">Resolve content questions</text><text x="1095" y="585">Find the editable source</text></g><text x="90" y="730" font-size="32">Every record: question + owner + review point</text><text x="90" y="800" font-size="26">Illustrative, untested records. Planning lanes—not accessibility verdicts.</text></g></svg>
