<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Portable EPUB annotation review workflow</title><desc id="desc">A reviewer exports notes as an annotation set, an EPUB creator resolves the issues, and a final check verifies the corrected build.</desc><rect width="1200" height="630" fill="#102b38"/><g font-family="Arial,sans-serif"><text x="64" y="78" font-size="23" fill="#8fd5c3">REX PUBLISHING / EPUB PRODUCTION WORKFLOW</text><text x="64" y="148" font-size="43" fill="#ffffff">Turn review notes into a portable QA handoff</text><g><rect x="64" y="210" width="290" height="218" rx="16" fill="#eaf3ee"/><rect x="455" y="210" width="290" height="218" rx="16" fill="#eaf3ee"/><rect x="846" y="210" width="290" height="218" rx="16" fill="#eaf3ee"/><path d="M374 319h61" stroke="#8fd5c3" stroke-width="10"/><path d="M423 301l22 18-22 18" fill="none" stroke="#8fd5c3" stroke-width="10"/><path d="M765 319h61" stroke="#8fd5c3" stroke-width="10"/><path d="M814 301l22 18-22 18" fill="none" stroke="#8fd5c3" stroke-width="10"/></g><g fill="#102b38" text-anchor="middle"><text x="209" y="264" font-size="29" font-weight="bold">1. Review</text><text x="209" y="315" font-size="24">Mark text, images</text><text x="209" y="351" font-size="24">and accessibility issues</text><text x="209" y="394" font-size="22">Freeze the source build</text><text x="600" y="264" font-size="29" font-weight="bold">2. Handoff</text><text x="600" y="315" font-size="24">Export an AnnotationSet</text><text x="600" y="351" font-size="24">with publication data</text><text x="600" y="394" font-size="22">Record each disposition</text><text x="991" y="264" font-size="29" font-weight="bold">3. Verify</text><text x="991" y="315" font-size="24">Correct the EPUB</text><text x="991" y="351" font-size="24">and test the new build</text><text x="991" y="394" font-size="22">Escalate misplaced notes</text></g><text x="64" y="511" font-size="27" fill="#ffffff">Draft standard: test the round trip before relying on portability.</text><text x="64" y="558" font-size="21" fill="#8fd5c3">Rex editorial planning aid · No claim of universal reading-system support</text></g></svg>
