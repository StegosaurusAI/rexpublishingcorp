<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dutch translation grants workflow diagram</title>
  <desc id="desc">A workflow graphic showing rights deal, translator contract, grant application, decision window, and publication for Dutch translation grants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="80" width="1460" height="740" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="120" y="170" fill="#0f172a" font-family="Arial, sans-serif" font-size="54" font-weight="700">
    Dutch translation grants for foreign publishers
  </text>
  <text x="120" y="225" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Practical sequence: deal first, translator next, timing discipline throughout
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="320" width="250" height="170" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="155" y="385" fill="#78350f" font-size="34" font-weight="700">1. Rights deal</text>
    <text x="155" y="430" fill="#92400e" font-size="24">Secure translation</text>
    <text x="155" y="462" fill="#92400e" font-size="24">rights with the</text>
    <text x="155" y="494" fill="#92400e" font-size="24">Dutch rights holder</text>

    <rect x="430" y="320" width="250" height="170" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
    <text x="465" y="385" fill="#14532d" font-size="34" font-weight="700">2. Contract</text>
    <text x="465" y="430" fill="#166534" font-size="24">Agree translator fee</text>
    <text x="465" y="462" fill="#166534" font-size="24">and lock the</text>
    <text x="465" y="494" fill="#166534" font-size="24">translation contract</text>

    <rect x="740" y="320" width="250" height="170" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
    <text x="770" y="385" fill="#1e3a8a" font-size="34" font-weight="700">3. Apply</text>
    <text x="770" y="430" fill="#1d4ed8" font-size="24">Send paperwork</text>
    <text x="770" y="462" fill="#1d4ed8" font-size="24">at least five months</text>
    <text x="770" y="494" fill="#1d4ed8" font-size="24">before publication</text>

    <rect x="1050" y="320" width="250" height="170" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/>
    <text x="1080" y="385" fill="#4c1d95" font-size="34" font-weight="700">4. Wait</text>
    <text x="1080" y="430" fill="#5b21b6" font-size="24">Decision window</text>
    <text x="1080" y="462" fill="#5b21b6" font-size="24">can run up to</text>
    <text x="1080" y="494" fill="#5b21b6" font-size="24">22 weeks</text>

    <rect x="1360" y="320" width="120" height="170" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1387" y="387" fill="#7f1d1d" font-size="30" font-weight="700">5.</text>
    <text x="1377" y="430" fill="#991b1b" font-size="21">Publish</text>
    <text x="1378" y="462" fill="#991b1b" font-size="21">within</text>
    <text x="1375" y="494" fill="#991b1b" font-size="21">2 years</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M370 405 H415"/>
    <path d="M680 405 H725"/>
    <path d="M990 405 H1035"/>
    <path d="M1300 405 H1345"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="120" y="610" fill="#0f172a" font-size="34" font-weight="700">Live 2026 deadline reminder</text>
    <text x="120" y="662" fill="#334155" font-size="28">Remaining application deadlines listed on July 16, 2026: September 3 and November 5</text>
    <text x="120" y="718" fill="#334155" font-size="28">Standard support usually covers 80% of the approved amount, capped at EUR 10,000</text>
    <text x="120" y="774" fill="#334155" font-size="28">Swedish translations get a separate Gothenburg 2027 uplift through the end of 2028</text>
  </g>
</svg>
