<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Estonia Traducta workflow card</title>
  <desc id="desc">A Rex Publishing workflow chart showing Estonia's August 20, 2026 Traducta deadline, the split between sample and publisher applications, and the contract, budget, and marketing documents needed for full filing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Estonia Traducta
  </text>
  <text x="118" y="218" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Use the August 20, 2026 deadline only if the project packet is already real
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="302" width="330" height="214" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
    <text x="152" y="366" fill="#1e3a8a" font-size="34" font-weight="700">Sample grant</text>
    <text x="152" y="414" fill="#1d4ed8" font-size="24">Translator lane</text>
    <text x="152" y="446" fill="#1d4ed8" font-size="24">Purpose of excerpt</text>
    <text x="152" y="478" fill="#1d4ed8" font-size="24">Original text copy</text>
    <text x="152" y="510" fill="#1d4ed8" font-size="24">CV and published work</text>

    <rect x="500" y="302" width="452" height="214" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
    <text x="536" y="366" fill="#14532d" font-size="34" font-weight="700">Translation or publication grant</text>
    <text x="536" y="414" fill="#166534" font-size="24">Foreign publisher lane</text>
    <text x="536" y="446" fill="#166534" font-size="24">Rights contract and translator contract</text>
    <text x="536" y="478" fill="#166534" font-size="24">Budget, marketing plan, and latest catalog</text>
    <text x="536" y="510" fill="#166534" font-size="24">Translator CV plus project details</text>

    <rect x="1004" y="302" width="430" height="214" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1040" y="366" fill="#7f1d1d" font-size="34" font-weight="700">Hard date</text>
    <text x="1040" y="414" fill="#991b1b" font-size="24">Treat 20 August 2026</text>
    <text x="1040" y="446" fill="#991b1b" font-size="24">as the filing cutoff even though</text>
    <text x="1040" y="478" fill="#991b1b" font-size="24">the broader period display runs</text>
    <text x="1040" y="510" fill="#991b1b" font-size="24">through 21 August 2026</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="578" width="1316" height="160" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="640" fill="#0f172a" font-size="34" font-weight="700">Workflow test</text>
    <text x="154" y="688" fill="#334155" font-size="28">No rights deal  |  no translator contract  |  no budget or marketing plan  =  wrong round</text>
  </g>
</svg>
