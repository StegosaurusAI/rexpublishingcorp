<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NCW mentorship deadline timeline card</title>
  <desc id="desc">A Rex Publishing explainer card showing the August 24, 2026 NCW mentorship deadline, the key application packet items, and the October to March programme timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="162" fill="#0f172a" font-family="Arial, sans-serif" font-size="50" font-weight="700">
    NCW Emerging Translator Mentorships
  </text>
  <text x="118" y="214" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Deadline: 24 August 2026 at 11:59 p.m. BST
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="282" width="404" height="236" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="150" y="346" fill="#1d4ed8" font-size="34" font-weight="700">Application packet</text>
    <text x="150" y="396" fill="#1e3a8a" font-size="24">Cover letter and CV</text>
    <text x="150" y="428" fill="#1e3a8a" font-size="24">One-page sample proposal</text>
    <text x="150" y="460" fill="#1e3a8a" font-size="24">Translation sample</text>
    <text x="150" y="492" fill="#1e3a8a" font-size="24">Matching source text</text>

    <rect x="598" y="282" width="404" height="236" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="632" y="346" fill="#166534" font-size="34" font-weight="700">Programme value</text>
    <text x="632" y="396" fill="#166534" font-size="24">Mentor meetings</text>
    <text x="632" y="428" fill="#166534" font-size="24">Industry events</text>
    <text x="632" y="460" fill="#166534" font-size="24">London Book Fair access</text>
    <text x="632" y="492" fill="#166534" font-size="24">Final showcase</text>

    <rect x="1078" y="282" width="356" height="236" rx="26" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1110" y="346" fill="#991b1b" font-size="34" font-weight="700">Hard rule</text>
    <text x="1110" y="396" fill="#991b1b" font-size="24">No AI in any part</text>
    <text x="1110" y="428" fill="#991b1b" font-size="24">of the application</text>
    <text x="1110" y="460" fill="#991b1b" font-size="24">or it is ineligible</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="580" width="1316" height="160" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="638" fill="#0f172a" font-size="34" font-weight="700">Timeline</text>
    <text x="154" y="686" fill="#334155" font-size="28">24 Aug deadline  |  Oct 2026 start  |  16-18 Mar 2027 London Book Fair  |  30 Mar 2027 showcase</text>
  </g>
</svg>
