<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Poland Translators' Collegium additional call guide</title>
  <desc id="desc">A Rex Publishing guide graphic showing the September 9, 2026 deadline and the remaining October, November, and December residency slots in Krakow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#d8e7dd"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="72" y="72" width="1456" height="756" rx="36" fill="#fffaf1" stroke="#1f3b2f" stroke-width="4"/>
  <text x="120" y="170" fill="#1f3b2f" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Rex Publishing</text>
  <text x="120" y="244" fill="#7a1f1f" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">Translators' Collegium</text>
  <text x="120" y="314" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Additional 2026 call</text>
  <rect x="120" y="370" width="480" height="142" rx="24" fill="#1f3b2f"/>
  <text x="160" y="428" fill="#f9f4e8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Applications due</text>
  <text x="160" y="482" fill="#f9f4e8" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">9 September 2026</text>
  <text x="120" y="590" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Remaining Krakow stays</text>
  <rect x="760" y="190" width="670" height="146" rx="24" fill="#f6ddd1" stroke="#7a1f1f" stroke-width="3"/>
  <text x="810" y="255" fill="#7a1f1f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">October 1-30, 2026</text>
  <text x="810" y="307" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="30">1 place</text>
  <rect x="760" y="384" width="670" height="146" rx="24" fill="#efe7c9" stroke="#7a6120" stroke-width="3"/>
  <text x="810" y="449" fill="#7a6120" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">November 1-30, 2026</text>
  <text x="810" y="501" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="30">1 place</text>
  <rect x="760" y="578" width="670" height="146" rx="24" fill="#dce9ee" stroke="#22536a" stroke-width="3"/>
  <text x="810" y="643" fill="#22536a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">December 1-31, 2026</text>
  <text x="810" y="695" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="30">3 places</text>
  <text x="120" y="664" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="26">Use for a concrete Polish-literature translation project.</text>
  <text x="120" y="708" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="26">Current call posted August 13, 2026.</text>
  <text x="120" y="780" fill="#5a655f" font-family="Arial, Helvetica, sans-serif" font-size="22">Source: Books from Poland / Polish Book Institute</text>
</svg>
