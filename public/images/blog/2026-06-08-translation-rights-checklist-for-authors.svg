<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Translation-rights evidence index</title>
  <desc id="desc">A four-column checklist linking a claimed rights scope to supporting documents, unresolved evidence, and a named next action.</desc>
  <rect width="1200" height="630" fill="#102b38"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="74" font-size="22" fill="#8fd5c3">REX PUBLISHING / TRANSLATION RIGHTS</text>
    <text x="64" y="137" font-size="43" font-weight="700" fill="#ffffff">Put evidence behind every rights claim</text>
    <text x="64" y="181" font-size="23" fill="#c7e5dc">Keep missing or conflicting documents visible until someone resolves them.</text>

    <g transform="translate(64 235)">
      <rect width="250" height="212" rx="16" fill="#eaf3ee"/>
      <circle cx="38" cy="40" r="20" fill="#166534"/>
      <text x="38" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">1</text>
      <text x="28" y="100" font-size="27" font-weight="700" fill="#102b38">Claimed scope</text>
      <text x="28" y="142" font-size="20" fill="#244a59">Language · territory</text>
      <text x="28" y="175" font-size="20" fill="#244a59">Format · term</text>
    </g>
    <g transform="translate(338 235)">
      <rect width="250" height="212" rx="16" fill="#eaf3ee"/>
      <circle cx="38" cy="40" r="20" fill="#166534"/>
      <text x="38" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">2</text>
      <text x="28" y="100" font-size="27" font-weight="700" fill="#102b38">Evidence</text>
      <text x="28" y="142" font-size="20" fill="#244a59">Document · date</text>
      <text x="28" y="175" font-size="20" fill="#244a59">Private file reference</text>
    </g>
    <g transform="translate(612 235)">
      <rect width="250" height="212" rx="16" fill="#eaf3ee"/>
      <circle cx="38" cy="40" r="20" fill="#166534"/>
      <text x="38" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">3</text>
      <text x="28" y="100" font-size="27" font-weight="700" fill="#102b38">Open question</text>
      <text x="28" y="142" font-size="20" fill="#244a59">Missing document</text>
      <text x="28" y="175" font-size="20" fill="#244a59">Conflicting evidence</text>
    </g>
    <g transform="translate(886 235)">
      <rect width="250" height="212" rx="16" fill="#eaf3ee"/>
      <circle cx="38" cy="40" r="20" fill="#166534"/>
      <text x="38" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">4</text>
      <text x="28" y="100" font-size="27" font-weight="700" fill="#102b38">Next check</text>
      <text x="28" y="142" font-size="20" fill="#244a59">Action · owner</text>
      <text x="28" y="175" font-size="20" fill="#244a59">Status stays honest</text>
    </g>

    <rect x="64" y="497" width="1072" height="74" rx="16" fill="#183f4d" stroke="#8fd5c3" stroke-width="2"/>
    <text x="600" y="543" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">An index organizes review. It does not prove ownership or clearance.</text>
  </g>
</svg>
