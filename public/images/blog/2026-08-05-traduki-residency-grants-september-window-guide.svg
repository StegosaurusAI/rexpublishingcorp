<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TRADUKI residency formats and deadline card</title>
  <desc id="desc">A Rex Publishing explainer card showing the September 15, 2026 TRADUKI residency deadline, the main applicant geography, and the six residency formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="156" fill="#0f172a" font-family="Arial, sans-serif" font-size="50" font-weight="700">
    TRADUKI Residency Grants 2026
  </text>
  <text x="118" y="210" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Deadline: 15 September 2026
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="264" width="548" height="226" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="152" y="324" fill="#166534" font-size="34" font-weight="700">Eligible applicant base</text>
    <text x="152" y="370" fill="#166534" font-size="24">Writers, translators, and book professionals</text>
    <text x="152" y="404" fill="#166534" font-size="24">From 10 Southeast European countries</text>
    <text x="152" y="438" fill="#166534" font-size="24">Application must match the stated format</text>

    <rect x="720" y="264" width="714" height="226" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="754" y="324" fill="#1d4ed8" font-size="34" font-weight="700">Support mechanics</text>
    <text x="754" y="370" fill="#1e3a8a" font-size="24">Travel and accommodation depend on format</text>
    <text x="754" y="404" fill="#1e3a8a" font-size="24">Translation and writing residencies: 2, 4, or 6 weeks</text>
    <text x="754" y="438" fill="#1e3a8a" font-size="24">Practical exchange and virtual routes use weekly support</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="542" width="1316" height="208" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="602" fill="#0f172a" font-size="34" font-weight="700">Formats</text>
    <text x="154" y="648" fill="#334155" font-size="26">Translation residency  |  Writing residency  |  Interdisciplinary cooperation</text>
    <text x="154" y="686" fill="#334155" font-size="26">Practical exchange  |  Research trip  |  Virtual residency</text>
    <text x="154" y="726" fill="#64748b" font-size="22">Host locations include Belgrade, Bucharest, Novo Mesto, Podgorica, Prishtina, Sarajevo, Skopje, Split, Sofia, and Tirana.</text>
  </g>
</svg>
