<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Literature Ireland translation grant workflow diagram</title>
  <desc id="desc">A workflow chart showing the remaining 2026 Literature Ireland filing window, translation sample review, no-printing rule, and post-publication payment proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Literature Ireland translation grant
  </text>
  <text x="118" y="218" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Treat the 2026 scheme as a narrow filing workflow, not rolling support
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="306" width="260" height="178" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
    <text x="150" y="372" fill="#1e3a8a" font-size="34" font-weight="700">1. Confirm rights</text>
    <text x="150" y="417" fill="#1d4ed8" font-size="24">Book must be</text>
    <text x="150" y="449" fill="#1d4ed8" font-size="24">currently in copyright</text>
    <text x="150" y="481" fill="#1d4ed8" font-size="24">from January 2026</text>

    <rect x="430" y="306" width="260" height="178" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
    <text x="470" y="372" fill="#14532d" font-size="34" font-weight="700">2. Prepare sample</text>
    <text x="470" y="417" fill="#166534" font-size="24">Translation sample</text>
    <text x="470" y="449" fill="#166534" font-size="24">goes to independent</text>
    <text x="470" y="481" fill="#166534" font-size="24">expert assessment</text>

    <rect x="742" y="306" width="260" height="178" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="790" y="372" fill="#78350f" font-size="34" font-weight="700">3. File on time</text>
    <text x="776" y="417" fill="#92400e" font-size="24">Remaining 2026 window</text>
    <text x="790" y="449" fill="#92400e" font-size="24">8 Sep to 29 Sep</text>
    <text x="770" y="481" fill="#92400e" font-size="24">unless permission granted</text>

    <rect x="1054" y="306" width="260" height="178" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1095" y="372" fill="#7f1d1d" font-size="34" font-weight="700">4. Wait</text>
    <text x="1080" y="417" fill="#991b1b" font-size="24">Typical decision in</text>
    <text x="1098" y="449" fill="#991b1b" font-size="24">6 to 8 weeks</text>
    <text x="1086" y="481" fill="#991b1b" font-size="24">and no printing yet</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M378 395 H414"/>
    <path d="M690 395 H726"/>
    <path d="M1002 395 H1038"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="566" width="1196" height="178" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="628" fill="#0f172a" font-size="34" font-weight="700">Post-publication payment checklist</text>
    <text x="154" y="676" fill="#334155" font-size="28">Approved acknowledgment page</text>
    <text x="640" y="676" fill="#334155" font-size="28">Proof of payment to translator</text>
    <text x="1092" y="676" fill="#334155" font-size="28">Copies of published book</text>
    <text x="154" y="724" fill="#475569" font-size="24">Grant payment completes after publication documents are in hand</text>
  </g>
</svg>
