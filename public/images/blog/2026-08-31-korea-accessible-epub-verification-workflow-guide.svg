<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Accessible EPUB verification workflow</title><desc id="desc">Five stages show file control, automated checks, manual review, correction records and release-build verification.</desc><rect width="1200" height="630" fill="#102b38"/><g font-family="Arial,sans-serif"><text x="64" y="76" font-size="23" fill="#8fd5c3">REX PUBLISHING / ACCESSIBLE EPUB WORKFLOW</text><text x="64" y="139" font-size="42" fill="#ffffff">Carry verification evidence into the release build</text><g fill="#eaf3ee"><rect x="64" y="205" width="196" height="214" rx="16"/><rect x="282" y="205" width="196" height="214" rx="16"/><rect x="500" y="205" width="196" height="214" rx="16"/><rect x="718" y="205" width="196" height="214" rx="16"/><rect x="936" y="205" width="200" height="214" rx="16"/></g><g fill="#102b38" text-anchor="middle"><text x="162" y="255" font-size="24" font-weight="bold">1. Control</text><text x="162" y="300" font-size="20">Identify the exact</text><text x="162" y="329" font-size="20">EPUB build</text><text x="380" y="255" font-size="24" font-weight="bold">2. Check</text><text x="380" y="300" font-size="20">Run format and</text><text x="380" y="329" font-size="20">automated tests</text><text x="598" y="255" font-size="24" font-weight="bold">3. Review</text><text x="598" y="300" font-size="20">Complete manual</text><text x="598" y="329" font-size="20">and reader checks</text><text x="816" y="255" font-size="24" font-weight="bold">4. Correct</text><text x="816" y="300" font-size="20">Assign fixes and</text><text x="816" y="329" font-size="20">record decisions</text><text x="1036" y="255" font-size="24" font-weight="bold">5. Verify</text><text x="1036" y="300" font-size="20">Recheck the file</text><text x="1036" y="329" font-size="20">that will ship</text></g><g fill="#2e716b"><circle cx="162" cy="379" r="13"/><circle cx="380" cy="379" r="13"/><circle cx="598" cy="379" r="13"/><circle cx="816" cy="379" r="13"/><circle cx="1036" cy="379" r="13"/></g><text x="64" y="500" font-size="28" fill="#ffffff">Keep automated findings, human judgment and delivery identity separate.</text><text x="64" y="550" font-size="21" fill="#8fd5c3">Rex editorial planning aid · No universal certification or usability guarantee</text></g></svg>
