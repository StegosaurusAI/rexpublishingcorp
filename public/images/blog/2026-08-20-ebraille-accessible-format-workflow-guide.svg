<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">eBraille accessible format workflow guide</title>
  <desc id="desc">Diagram comparing flatter braille file workflows with eBraille, showing reflow, navigation, graphics support, and current production paths from Word, DTBook, and EPUB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>

  <text x="128" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    eBraille workflow signal
  </text>
  <text x="128" y="214" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Structured source files now make richer braille output more realistic
  </text>

  <g font-family="Arial, sans-serif">
    <rect x="128" y="290" width="314" height="214" rx="28" fill="#eef2ff" stroke="#4f46e5" stroke-width="4"/>
    <text x="164" y="352" fill="#3730a3" font-size="34" font-weight="700">Traditional path</text>
    <text x="164" y="402" fill="#4338ca" font-size="24">Flat final file</text>
    <text x="164" y="436" fill="#4338ca" font-size="24">Limited navigation</text>
    <text x="164" y="470" fill="#4338ca" font-size="24">Graphics often separate</text>

    <rect x="486" y="290" width="314" height="214" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="528" y="352" fill="#166534" font-size="34" font-weight="700">eBraille path</text>
    <text x="528" y="402" fill="#166534" font-size="24">Reflow across devices</text>
    <text x="528" y="436" fill="#166534" font-size="24">Headings, lists, tables</text>
    <text x="528" y="470" fill="#166534" font-size="24">Text plus tactile graphics</text>

    <rect x="844" y="290" width="562" height="214" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="886" y="352" fill="#92400e" font-size="34" font-weight="700">Current production bridge</text>
    <text x="886" y="402" fill="#92400e" font-size="24">Word or DTBook -> DAISY Pipeline -> eBraille</text>
    <text x="886" y="436" fill="#92400e" font-size="24">EPUB -> BrailleBlaster or EPUBToWord -> braille QA</text>
    <text x="886" y="470" fill="#92400e" font-size="24">Validation route: eBraille Check</text>
  </g>

  <g stroke="#94a3b8" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M442 398 H470"/>
    <path d="M800 398 H828"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="128" y="584" width="1278" height="162" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="164" y="648" fill="#0f172a" font-size="34" font-weight="700">Reality check</text>
    <text x="164" y="696" fill="#334155" font-size="28">Important enough to test now, not broad enough to promise universal support across every tool and device.</text>
  </g>
</svg>
