<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">FILI: a print-edition handoff</title><desc id="desc">Rights and translator documents, application and conditional decision, then publication and payment evidence. Grant cash is not an advance on the translator fee.</desc><rect width="1600" height="900" fill="#102b36"/><g font-family="Arial,sans-serif"><text x="90" y="120" fill="#fff" font-size="56" font-weight="bold">FILI: a print-edition handoff</text><text x="90" y="180" fill="#b8d9dc" font-size="28">Organize the documents. Plan the cash gap.</text><g fill="#fff"><rect x="90" y="265" width="420" height="350" rx="24"/><rect x="590" y="265" width="420" height="350" rx="24"/><rect x="1090" y="265" width="420" height="350" rx="24"/></g><g fill="#102b36"><text x="125" y="335" font-size="34" font-weight="bold">1 / Before filing</text><text x="125" y="415" font-size="28">Rights acquired</text><text x="125" y="470" font-size="28">Translator agreement</text><text x="125" y="525" font-size="28">Qualifications ready</text><text x="625" y="335" font-size="34" font-weight="bold">2 / Review</text><text x="625" y="415" font-size="28">Application + evidence</text><text x="625" y="470" font-size="28">Conditional decision</text><text x="625" y="525" font-size="28">Check before printing</text><text x="1125" y="335" font-size="34" font-weight="bold">3 / Payment file</text><text x="1125" y="415" font-size="28">Published print copy</text><text x="1125" y="470" font-size="28">Translator-pay proof</text><text x="1125" y="525" font-size="28">Request + attachments</text></g><g fill="#73ddd0"><path d="M525 430h40l-15-15v10h-25zm40 0-15 15v-10h-25v-5z"/><path d="M1025 430h40l-15-15v10h-25zm40 0-15 15v-10h-25v-5z"/></g><text x="90" y="730" fill="#73ddd0" font-size="36" font-weight="bold">Grant cash is not a translator-fee advance.</text><text x="90" y="790" fill="#b8d9dc" font-size="27">Rex Publishing / Read the full print-edition checklist and official rules.</text></g></svg>