<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Frankfurt 2027 LitAg and PRC booking comparison</title>
  <desc id="desc">Comparison of Frankfurt 2027 LitAg and Publishers Rights Centre eligibility, table prices, deadlines, and Tuesday-to-Friday operating days.</desc>
  <rect width="1200" height="630" fill="#102b38"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="68" font-size="21" fill="#8fd5c3">REX PUBLISHING / RIGHTS PLANNING</text>
    <text x="64" y="124" font-size="42" font-weight="700" fill="#ffffff">Frankfurt 2027: LitAg or PRC?</text>
    <text x="64" y="164" font-size="22" fill="#c7e5dc">Choose by role first. Then test the price against your meeting calendar.</text>

    <g transform="translate(64 208)">
      <rect width="510" height="268" rx="18" fill="#eaf3ee"/>
      <rect width="510" height="62" rx="18" fill="#166534"/>
      <rect y="44" width="510" height="18" fill="#166534"/>
      <text x="28" y="42" font-size="29" font-weight="700" fill="#ffffff">LitAg</text>
      <text x="28" y="105" font-size="20" font-weight="700" fill="#102b38">Independent literary and scouting agencies</text>
      <text x="28" y="154" font-size="23" fill="#244a59">Early bird: EUR 1,415</text>
      <text x="28" y="193" font-size="23" fill="#244a59">Standard: EUR 1,459</text>
      <text x="28" y="237" font-size="20" font-weight="700" fill="#166534">Tuesday-Friday</text>
    </g>

    <g transform="translate(626 208)">
      <rect width="510" height="268" rx="18" fill="#eef2f6"/>
      <rect width="510" height="62" rx="18" fill="#315a74"/>
      <rect y="44" width="510" height="18" fill="#315a74"/>
      <text x="28" y="42" font-size="29" font-weight="700" fill="#ffffff">Publishers Rights Centre</text>
      <text x="28" y="105" font-size="20" font-weight="700" fill="#102b38">Publishers and their rights teams</text>
      <text x="28" y="154" font-size="23" fill="#244a59">Early bird: EUR 3,652</text>
      <text x="28" y="193" font-size="23" fill="#244a59">Standard: EUR 3,765</text>
      <text x="28" y="237" font-size="20" font-weight="700" fill="#315a74">Tuesday-Friday</text>
    </g>

    <rect x="64" y="509" width="1072" height="70" rx="16" fill="#183f4d" stroke="#8fd5c3" stroke-width="2"/>
    <text x="600" y="539" text-anchor="middle" font-size="20" fill="#ffffff">Early-bird cutoff: 30 Nov 2026 · Registration deadline: 31 Jan 2027</text>
    <text x="600" y="565" text-anchor="middle" font-size="17" fill="#c7e5dc">Prices exclude VAT · Check the live application and terms before signing</text>
  </g>
</svg>
