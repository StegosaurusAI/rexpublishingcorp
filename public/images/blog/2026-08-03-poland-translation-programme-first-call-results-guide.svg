<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Poland translation programme first-call results guide</title>
  <desc id="desc">A Rex Publishing guide graphic showing 197 supported proposals, 40 countries, and the September 15, 2026 second-call deadline for the Polish Book Institute's translation programme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#dbe8e0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="72" y="72" width="1456" height="756" rx="36" fill="#fffaf1" stroke="#1f3b2f" stroke-width="4"/>
  <text x="120" y="170" fill="#1f3b2f" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Rex Publishing</text>
  <text x="120" y="244" fill="#7a1f1f" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700">©POLAND first-call results</text>
  <text x="120" y="314" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Use the July 31, 2026 file as market signal</text>
  <rect x="120" y="372" width="320" height="160" rx="24" fill="#1f3b2f"/>
  <text x="160" y="434" fill="#f9f4e8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Supported proposals</text>
  <text x="160" y="500" fill="#f9f4e8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">197</text>
  <rect x="470" y="372" width="320" height="160" rx="24" fill="#7a1f1f"/>
  <text x="510" y="434" fill="#fdf6ef" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Countries</text>
  <text x="510" y="500" fill="#fdf6ef" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">40</text>
  <rect x="820" y="372" width="640" height="160" rx="24" fill="#efe7c9" stroke="#7a6120" stroke-width="3"/>
  <text x="860" y="434" fill="#7a6120" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Second 2026 call remains open</text>
  <text x="860" y="500" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Through 15 September 2026</text>
  <text x="120" y="618" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Institute priority languages for 2026</text>
  <rect x="120" y="652" width="450" height="96" rx="22" fill="#dce9ee" stroke="#22536a" stroke-width="3"/>
  <text x="160" y="711" fill="#22536a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Scandinavian languages and Italian</text>
  <text x="760" y="620" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Published examples show reach beyond one corridor</text>
  <text x="760" y="674" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="28">Argentina, Azerbaijan, Lebanon, Mongolia, South Korea</text>
  <text x="760" y="722" fill="#1f3b2f" font-family="Arial, Helvetica, sans-serif" font-size="28">Plus a first reported Urdu path in Pakistan</text>
  <text x="120" y="790" fill="#5a655f" font-family="Arial, Helvetica, sans-serif" font-size="22">Source: Polish Book Institute results announcement and live programme page</text>
</svg>
