<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Translator conference preparation checklist</title><desc id="desc">Four steps: verify access, separate costs, prepare project questions and record agreed follow-up. Organizer policy does not establish ticket availability.</desc><rect width="1200" height="600" fill="#132b32"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="19" letter-spacing="3" fill="#86dac7">REX PUBLISHING / PRACTICAL GUIDE</text><text x="64" y="135" font-size="43" font-weight="700" fill="#ffffff">Make conference time useful</text><text x="64" y="181" font-size="23" fill="#d6e7e5">Access first. Then questions, conversations and next steps.</text><rect x="64" y="222" width="516" height="124" rx="14" fill="#24434a"/><text x="88" y="262" fill="#86dac7" font-size="22">01</text><text x="144" y="264" fill="#fff" font-size="29" font-weight="700">Verify access</text><text x="144" y="305" fill="#d6e7e5" font-size="21">Resolve organizer questions</text><rect x="620" y="222" width="516" height="124" rx="14" fill="#24434a"/><text x="644" y="262" fill="#86dac7" font-size="22">02</text><text x="700" y="264" fill="#fff" font-size="29" font-weight="700">Separate costs</text><text x="700" y="305" fill="#d6e7e5" font-size="21">Admission is not the full budget</text><rect x="64" y="370" width="516" height="124" rx="14" fill="#24434a"/><text x="88" y="410" fill="#86dac7" font-size="22">03</text><text x="144" y="412" fill="#fff" font-size="29" font-weight="700">Prepare questions</text><text x="144" y="453" fill="#d6e7e5" font-size="21">Name what you want to learn</text><rect x="620" y="370" width="516" height="124" rx="14" fill="#24434a"/><text x="644" y="410" fill="#86dac7" font-size="22">04</text><text x="700" y="412" fill="#fff" font-size="29" font-weight="700">Record follow-up</text><text x="700" y="453" fill="#d6e7e5" font-size="21">Keep the agreed next action</text><text x="64" y="551" fill="#d6e7e5" font-size="20">Rex preparation advice · Published policy is not ticket inventory.</text></g></svg>
