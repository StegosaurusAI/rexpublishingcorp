<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Canadian titles five-year market guide</title>
  <desc id="desc">Chart-style diagram comparing buyer interest, sales growth, and library borrowing for Canadian-contributor titles over five years.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="56" y="60" width="1488" height="780" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="116" y="150" fill="#0f172a" font-family="Arial, sans-serif" font-size="48" font-weight="700">Canadian titles over five years</text>
  <text x="116" y="202" fill="#475569" font-family="Arial, sans-serif" font-size="28">Useful signal: rising interest and borrowing, but uneven category growth still needs selective reading</text>

  <g font-family="Arial, sans-serif">
    <rect x="116" y="282" width="380" height="270" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="148" y="350" fill="#1d4ed8" font-size="34" font-weight="700">Reader interest</text>
    <text x="148" y="410" fill="#1e3a8a" font-size="30">38% searched in 2025</text>
    <text x="148" y="454" fill="#1e3a8a" font-size="30">32% searched in 2024</text>
    <text x="148" y="512" fill="#1e3a8a" font-size="24">Signal: more active demand for</text>
    <text x="148" y="544" fill="#1e3a8a" font-size="24">Canadian-contributor books</text>

    <rect x="610" y="282" width="380" height="270" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="642" y="350" fill="#166534" font-size="34" font-weight="700">Sales picture</text>
    <text x="642" y="410" fill="#166534" font-size="30">Fiction: +62%</text>
    <text x="642" y="454" fill="#166534" font-size="30">All subjects: +15%</text>
    <text x="642" y="498" fill="#166534" font-size="30">Non-fiction and YA: down</text>
    <text x="642" y="544" fill="#166534" font-size="24">Signal: growth exists, but not</text>
    <text x="642" y="576" fill="#166534" font-size="24">as one clean market story</text>

    <rect x="1104" y="282" width="340" height="270" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="1136" y="350" fill="#92400e" font-size="34" font-weight="700">Library picture</text>
    <text x="1136" y="410" fill="#92400e" font-size="30">All loans: +95%</text>
    <text x="1136" y="454" fill="#92400e" font-size="30">Juvenile loans: +109%</text>
    <text x="1136" y="512" fill="#92400e" font-size="24">Signal: access behavior still</text>
    <text x="1136" y="544" fill="#92400e" font-size="24">matters to market value</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="116" y="622" width="1328" height="126" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="150" y="688" fill="#334155" font-size="30">BookNet Canada snapshot rule: use the broad trend, but do not let one fast-growing subcategory stand in for the whole market.</text>
  </g>
</svg>
