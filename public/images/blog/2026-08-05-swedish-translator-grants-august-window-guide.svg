<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Swedish translator grant deadline card</title>
  <desc id="desc">A Rex Publishing explainer card showing the Swedish translator grant deadline of August 25, 2026, that the applicant must be a professional translator, and that publishers cannot apply.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Swedish translator grant
  </text>
  <text x="118" y="218" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Deadline: 25 August 2026
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="292" width="398" height="214" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="150" y="356" fill="#1d4ed8" font-size="34" font-weight="700">Who can apply</text>
    <text x="150" y="406" fill="#1e3a8a" font-size="24">Professional translators</text>
    <text x="150" y="438" fill="#1e3a8a" font-size="24">of Swedish literature</text>
    <text x="150" y="470" fill="#1e3a8a" font-size="24">and drama</text>

    <rect x="602" y="292" width="398" height="214" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="636" y="356" fill="#166534" font-size="34" font-weight="700">What it supports</text>
    <text x="636" y="406" fill="#166534" font-size="24">Exchange, skills growth,</text>
    <text x="636" y="438" fill="#166534" font-size="24">travel, and sample-work</text>
    <text x="636" y="470" fill="#166534" font-size="24">use cases</text>

    <rect x="1086" y="292" width="348" height="214" rx="26" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1120" y="356" fill="#991b1b" font-size="34" font-weight="700">Who cannot apply</text>
    <text x="1120" y="406" fill="#991b1b" font-size="24">Publishers, networks,</text>
    <text x="1120" y="438" fill="#991b1b" font-size="24">organisations, or</text>
    <text x="1120" y="470" fill="#991b1b" font-size="24">translators into Swedish</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="574" width="1316" height="160" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="636" fill="#0f172a" font-size="34" font-weight="700">Practical reading for August 17, 2026</text>
    <text x="154" y="684" fill="#334155" font-size="28">This is a translator-side workflow tool, not Sweden's publisher translation subsidy.</text>
  </g>
</svg>
