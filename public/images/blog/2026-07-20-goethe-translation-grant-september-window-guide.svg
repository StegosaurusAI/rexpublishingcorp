<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Goethe translation funding workflow diagram</title>
  <desc id="desc">A diagram showing the August 15 to September 15, 2026 Goethe-Institut application window, the contracts and file required for application, and the reimbursement-only funding model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="56" y="64" width="1488" height="772" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="116" y="158" fill="#111827" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Goethe-Institut translation-funding workflow
  </text>
  <text x="116" y="212" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    August 15 to September 15, 2026 for books going to press in December 2026 or later
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="116" y="292" width="292" height="194" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="154" y="356" fill="#1e3a8a" font-size="34" font-weight="700">1. Stay off press</text>
    <text x="154" y="402" fill="#1d4ed8" font-size="24">Do not print before</text>
    <text x="154" y="434" fill="#1d4ed8" font-size="24">the funding agreement</text>
    <text x="154" y="466" fill="#1d4ed8" font-size="24">has been signed</text>

    <rect x="456" y="292" width="292" height="194" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="500" y="356" fill="#14532d" font-size="34" font-weight="700">2. Build the packet</text>
    <text x="494" y="402" fill="#166534" font-size="24">Rights-holder contract</text>
    <text x="494" y="434" fill="#166534" font-size="24">Translator contract</text>
    <text x="494" y="466" fill="#166534" font-size="24">CV plus original-book file</text>

    <rect x="796" y="292" width="292" height="194" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="842" y="356" fill="#78350f" font-size="34" font-weight="700">3. File on time</text>
    <text x="844" y="402" fill="#92400e" font-size="24">Window opens</text>
    <text x="844" y="434" fill="#92400e" font-size="24">15 Aug 2026</text>
    <text x="844" y="466" fill="#92400e" font-size="24">Closes 15 Sep 2026</text>

    <rect x="1136" y="292" width="292" height="194" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="1186" y="356" fill="#7f1d1d" font-size="34" font-weight="700">4. Budget correctly</text>
    <text x="1176" y="402" fill="#991b1b" font-size="24">Usually 40 to 60%</text>
    <text x="1172" y="434" fill="#991b1b" font-size="24">of translation cost</text>
    <text x="1170" y="466" fill="#991b1b" font-size="24">after publication</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M408 388 H442"/>
    <path d="M748 388 H782"/>
    <path d="M1088 388 H1122"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="116" y="554" width="1312" height="204" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="152" y="618" fill="#111827" font-size="34" font-weight="700">Keep the exclusions and carve-outs exact</text>
    <text x="152" y="668" fill="#334155" font-size="28">No licensing, printing, or editorial-cost support</text>
    <text x="822" y="668" fill="#334155" font-size="28">Contemporary Austrian and Swiss fiction route elsewhere</text>
    <text x="152" y="718" fill="#475569" font-size="24">Goethe funds German-language translation projects, but the publisher still needs a real rights deal, a real translator, and enough time before print.</text>
  </g>
</svg>
