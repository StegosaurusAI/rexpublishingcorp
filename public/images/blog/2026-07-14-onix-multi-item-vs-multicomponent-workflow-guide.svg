<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ONIX multi-item versus multicomponent decision tree</title>
  <desc id="desc">A Rex Publishing diagram showing that separately saleable parts point to multi-item logic, while inseparable package components point to multicomponent logic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="100%" stop-color="#e1ecf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="120" y="88" width="1360" height="724" rx="36" fill="#fffdf8" stroke="#d6d3d1" stroke-width="2"/>
  <text x="180" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#1f2937">ONIX bundle decision</text>
  <text x="180" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#475569">Classify the product by saleability, not by whether the packaging looks like a set.</text>

  <g filter="url(#shadow)">
    <rect x="470" y="280" width="660" height="130" rx="28" fill="#17324d"/>
    <text x="800" y="335" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Can the enclosed parts be bought separately?</text>
    <text x="800" y="375" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#dbeafe">Think ordinary retail availability, not collector packaging.</text>
  </g>

  <path d="M800 410 L800 485" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M800 485 L430 485" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M800 485 L1170 485" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M430 485 L430 545" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M1170 485 L1170 545" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>

  <text x="505" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">YES</text>
  <text x="1090" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">NO</text>

  <g filter="url(#shadow)">
    <rect x="180" y="545" width="500" height="190" rx="28" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <text x="220" y="605" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#14532d">Multi-item logic</text>
    <text x="220" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#166534">Separate products collected together</text>
    <text x="220" y="695" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#166534">Use when the items stand on their own in the market.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="545" width="500" height="190" rx="28" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="960" y="605" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#9a3412">Multicomponent logic</text>
    <text x="960" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#c2410c">One retail product with components inside</text>
    <text x="960" y="695" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#c2410c">Describe component formats with ProductPart where needed.</text>
  </g>
</svg>
