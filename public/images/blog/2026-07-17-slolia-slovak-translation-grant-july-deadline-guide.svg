<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SLOLIA grant workflow diagram</title>
  <desc id="desc">A workflow diagram showing the July 31 SLOLIA deadline, contract packet, six-week decision window, and payment after five hard copies are delivered.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    SLOLIA foreign-publisher workflow
  </text>
  <text x="118" y="218" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    File before publication, wait for review, and expect payment after delivery
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="306" width="260" height="178" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="152" y="372" fill="#1e3a8a" font-size="34" font-weight="700">1. Stay unpublished</text>
    <text x="152" y="417" fill="#1d4ed8" font-size="24">Book must not be</text>
    <text x="152" y="449" fill="#1d4ed8" font-size="24">published when the</text>
    <text x="152" y="481" fill="#1d4ed8" font-size="24">application is filed</text>

    <rect x="430" y="306" width="260" height="178" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="468" y="372" fill="#14532d" font-size="34" font-weight="700">2. Send contracts</text>
    <text x="468" y="417" fill="#166534" font-size="24">Application form</text>
    <text x="468" y="449" fill="#166534" font-size="24">plus author and</text>
    <text x="468" y="481" fill="#166534" font-size="24">translator contracts</text>

    <rect x="742" y="306" width="260" height="178" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="790" y="372" fill="#78350f" font-size="34" font-weight="700">3. File by July 31</text>
    <text x="770" y="417" fill="#92400e" font-size="24">Regular annual dates</text>
    <text x="790" y="449" fill="#92400e" font-size="24">31 Jan, 30 Apr,</text>
    <text x="790" y="481" fill="#92400e" font-size="24">31 Jul, 31 Oct</text>

    <rect x="1054" y="306" width="260" height="178" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1090" y="372" fill="#7f1d1d" font-size="34" font-weight="700">4. Wait for decision</text>
    <text x="1090" y="417" fill="#991b1b" font-size="24">Board decides within</text>
    <text x="1110" y="449" fill="#991b1b" font-size="24">six weeks, but</text>
    <text x="1078" y="481" fill="#991b1b" font-size="24">budget can delay action</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M378 395 H414"/>
    <path d="M690 395 H726"/>
    <path d="M1002 395 H1038"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="566" width="1196" height="178" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="628" fill="#0f172a" font-size="34" font-weight="700">Payment closes after publication</text>
    <text x="154" y="676" fill="#334155" font-size="28">Send five hard copies</text>
    <text x="580" y="676" fill="#334155" font-size="28">Use the required acknowledgment</text>
    <text x="1116" y="676" fill="#334155" font-size="28">Display the SLC logo</text>
    <text x="154" y="724" fill="#475569" font-size="24">Grant funds transfer only after the Board receives the supported book and required copyright-page treatment</text>
  </g>
</svg>
