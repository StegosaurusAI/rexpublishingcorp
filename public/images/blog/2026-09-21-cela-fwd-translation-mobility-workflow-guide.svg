<title id="title">CELA fwd mobility: prepare before travelling</title>
<desc id="desc">Check programme connection and full conditions. Plan green travel and retain journey evidence. Complete reflection, photos and reporting. Publicity duties apply; payment is conditional. Not an eligibility or funding calculator.</desc>
