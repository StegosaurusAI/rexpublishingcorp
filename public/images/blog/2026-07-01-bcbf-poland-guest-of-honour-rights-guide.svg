<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Polish collective stand at Bologna 2027 application checklist</title>
  <desc id="desc">Decision card showing the December 8, 2026 deadline, registration requirement, rack and shelf prices, and limited-place warning.</desc>
  <rect width="1200" height="630" fill="#102b38"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="68" font-size="21" fill="#8fd5c3">REX PUBLISHING / FAIR PLANNING</text>
    <text x="64" y="124" font-size="42" font-weight="700" fill="#ffffff">Polish collective stand at Bologna 2027</text>
    <text x="64" y="164" font-size="22" fill="#c7e5dc">Check eligibility, register first, then choose the display that fits the rights list.</text>

    <g transform="translate(64 208)">
      <rect width="510" height="218" rx="18" fill="#eaf3ee"/>
      <rect width="510" height="62" rx="18" fill="#166534"/>
      <rect y="44" width="510" height="18" fill="#166534"/>
      <text x="28" y="42" font-size="29" font-weight="700" fill="#ffffff">One rack</text>
      <text x="28" y="116" font-size="34" font-weight="700" fill="#102b38">PLN 2,500 net</text>
      <text x="28" y="161" font-size="20" fill="#244a59">3-4 shelves · about 90 cm each</text>
      <text x="28" y="195" font-size="18" fill="#166534">Choose for a focused, rights-ready list</text>
    </g>

    <g transform="translate(626 208)">
      <rect width="510" height="218" rx="18" fill="#eef2f6"/>
      <rect width="510" height="62" rx="18" fill="#315a74"/>
      <rect y="44" width="510" height="18" fill="#315a74"/>
      <text x="28" y="42" font-size="29" font-weight="700" fill="#ffffff">One shelf</text>
      <text x="28" y="116" font-size="34" font-weight="700" fill="#102b38">PLN 700 net</text>
      <text x="28" y="161" font-size="20" fill="#244a59">About 90 cm wide</text>
      <text x="28" y="195" font-size="18" fill="#315a74">Start here if the working list is compact</text>
    </g>

    <rect x="64" y="463" width="1072" height="116" rx="16" fill="#183f4d" stroke="#8fd5c3" stroke-width="2"/>
    <text x="92" y="502" font-size="22" font-weight="700" fill="#ffffff">Apply by 8 Dec 2026</text>
    <text x="92" y="536" font-size="19" fill="#c7e5dc">Portal registration required · Places limited · Application is not acceptance</text>
    <text x="92" y="565" font-size="17" fill="#8fd5c3">Read the current Polish rules and portal instructions before submitting</text>
  </g>
</svg>
