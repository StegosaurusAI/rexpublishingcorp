<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Three language checks for a translated EPUB</title><desc id="desc">Publication language, metadata-text language, and document or inline language are separate checks. Package language does not cascade into chapters.</desc><rect width="1600" height="900" fill="#102838"/><g font-family="Arial, sans-serif" fill="#ffffff"><text x="90" y="120" font-size="54" font-weight="700">Translated EPUBs</text><text x="90" y="185" font-size="36">Three language checks. Different jobs.</text><rect x="80" y="245" width="1440" height="145" rx="18" fill="#1d4053"/><text x="110" y="307" font-size="42" fill="#8fe3ca">01</text><text x="215" y="297" font-size="34" font-weight="700">Publication language</text><text x="215" y="351" font-size="28">Which primary content languages?</text><text x="920" y="327" font-size="29" fill="#8fe3ca">dc:language = en</text><rect x="80" y="415" width="1440" height="145" rx="18" fill="#1d4053"/><text x="110" y="477" font-size="42" fill="#8fe3ca">02</text><text x="215" y="467" font-size="34" font-weight="700">Metadata-text language</text><text x="215" y="521" font-size="28">What language is the metadata text?</text><text x="920" y="497" font-size="29" fill="#8fe3ca">package xml:lang = en</text><rect x="80" y="585" width="1440" height="145" rx="18" fill="#1d4053"/><text x="110" y="647" font-size="42" fill="#8fe3ca">03</text><text x="215" y="637" font-size="34" font-weight="700">Document + inline language</text><text x="215" y="691" font-size="28">What language is this text?</text><text x="920" y="667" font-size="29" fill="#8fe3ca">XHTML en / Polish span pl</text><text x="90" y="825" font-size="31">Package language does not cascade into chapters.</text><text x="90" y="872" font-size="24" fill="#b6cbd6">Rex Publishing · Illustrative language map · Exceptions and QA in the article</text></g></svg>
