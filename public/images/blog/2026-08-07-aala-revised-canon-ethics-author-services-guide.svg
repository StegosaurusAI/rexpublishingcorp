<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AALA canon comparison for agency-linked paid services</title>
  <desc id="desc">A comparison chart showing what stayed prohibited and what changed between the April 29, 2022 AALA canon and the revised canon effective September 1, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="64" width="1472" height="772" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="112" y="148" fill="#111827" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    AALA ethics canon: what changed for paid services
  </text>
  <text x="112" y="202" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    April 29, 2022 baseline to September 1, 2026 effective date
  </text>

  <g font-family="Arial, sans-serif">
    <rect x="112" y="262" width="620" height="112" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <text x="144" y="328" fill="#075985" font-size="34" font-weight="700">Still prohibited</text>
    <text x="144" y="360" fill="#0f172a" font-size="24">Reading fees charged directly to authors for evaluation</text>

    <rect x="768" y="262" width="720" height="112" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="800" y="328" fill="#166534" font-size="34" font-weight="700">Still prohibited</text>
    <text x="800" y="360" fill="#0f172a" font-size="24">Charging represented clients for editorial work tied to submission prep</text>

    <rect x="112" y="416" width="620" height="180" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="144" y="476" fill="#92400e" font-size="34" font-weight="700">Rule changed</text>
    <text x="144" y="516" fill="#0f172a" font-size="24">Old canon: prior paid editorial fees had</text>
    <text x="144" y="548" fill="#0f172a" font-size="24">to be refunded if representation followed.</text>
    <text x="144" y="580" fill="#0f172a" font-size="24">New canon: treatment of those fees is by</text>
    <text x="144" y="612" fill="#0f172a" font-size="24">mutual agreement between the parties.</text>

    <rect x="768" y="416" width="720" height="180" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="800" y="476" fill="#991b1b" font-size="34" font-weight="700">Newly spelled out</text>
    <text x="800" y="516" fill="#0f172a" font-size="24">Other paid services such as marketing, promotion,</text>
    <text x="800" y="548" fill="#0f172a" font-size="24">or web design may exist only if representation</text>
    <text x="800" y="580" fill="#0f172a" font-size="24">is not contingent on buying them and clients are</text>
    <text x="800" y="612" fill="#0f172a" font-size="24">told they may choose outside providers.</text>

    <rect x="112" y="638" width="1376" height="132" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <text x="144" y="700" fill="#111827" font-size="34" font-weight="700">Useful author check</text>
    <text x="144" y="742" fill="#334155" font-size="26">If the paid service is truly optional, the agency should be able to state that in writing and explain who performs the work,</text>
    <text x="144" y="776" fill="#334155" font-size="26">who gets paid, and whether representation would proceed the same way if the author bought nothing at all.</text>
  </g>
</svg>
