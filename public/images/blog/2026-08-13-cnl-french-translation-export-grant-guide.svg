<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CNL French translation export grant workflow</title>
  <desc id="desc">A workflow chart showing the September 17 to October 29, 2026 CNL filing window, the French publisher filing role, the sample translation and contracts dossier, and the January to February 2027 review period.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    CNL translation export workflow
  </text>
  <text x="118" y="218" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Prepare the rights file before the September 17, 2026 opening
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="296" width="290" height="186" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="152" y="360" fill="#1d4ed8" font-size="34" font-weight="700">1. Window timing</text>
    <text x="154" y="408" fill="#1e40af" font-size="24">Open: 17 September 2026</text>
    <text x="154" y="440" fill="#1e40af" font-size="24">Close: 29 October 2026</text>
    <text x="154" y="472" fill="#1e40af" font-size="24">Review: Jan-Feb 2027</text>

    <rect x="460" y="296" width="290" height="186" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="486" y="360" fill="#166534" font-size="34" font-weight="700">2. French side files</text>
    <text x="496" y="408" fill="#166534" font-size="24">Application goes through</text>
    <text x="496" y="440" fill="#166534" font-size="24">the French publisher or</text>
    <text x="496" y="472" fill="#166534" font-size="24">filing literary agent</text>

    <rect x="802" y="296" width="290" height="186" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="838" y="360" fill="#92400e" font-size="34" font-weight="700">3. Build dossier</text>
    <text x="840" y="408" fill="#92400e" font-size="24">20% sample translation,</text>
    <text x="840" y="440" fill="#92400e" font-size="24">rights contract, and</text>
    <text x="840" y="472" fill="#92400e" font-size="24">translator documents</text>

    <rect x="1144" y="296" width="290" height="186" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1180" y="360" fill="#991b1b" font-size="34" font-weight="700">4. Hold release</text>
    <text x="1188" y="408" fill="#991b1b" font-size="24">No publication before</text>
    <text x="1188" y="440" fill="#991b1b" font-size="24">commission review and</text>
    <text x="1188" y="472" fill="#991b1b" font-size="24">valid rights at review</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M408 389 H444"/>
    <path d="M750 389 H786"/>
    <path d="M1092 389 H1128"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="560" width="1316" height="188" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="624" fill="#0f172a" font-size="34" font-weight="700">Useful planning question</text>
    <text x="154" y="674" fill="#334155" font-size="28">Do the French publisher, foreign publisher, and translator already have one coherent file?</text>
    <text x="154" y="718" fill="#475569" font-size="24">If not, the problem is workflow readiness, not lack of grant awareness.</text>
  </g>
</svg>
