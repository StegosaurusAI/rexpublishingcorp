<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Turin 2027: separate the decisions</title><desc id="desc">Application is not selection. Paid access needs its own ticket, table and platform checks. Record evidence and assign an owner.</desc><rect width="1200" height="630" fill="#102b38"/><g font-family="Arial,sans-serif"><text x="64" y="80" font-size="23" fill="#8fd5c3">REX PUBLISHING / RIGHTS-EVENT PREPARATION</text><text x="64" y="153" font-size="44" fill="white">Turin 2027: separate the decisions</text><rect x="64" y="207" width="516" height="263" rx="16" fill="#eaf3ee"/><rect x="612" y="207" width="524" height="263" rx="16" fill="#eaf3ee"/><g fill="#102b38"><text x="94" y="258" font-size="28" font-weight="bold">Book to Book fellowship</text><text x="94" y="313" font-size="25">Check role and application</text><text x="94" y="355" font-size="25">Record submission status</text><text x="94" y="414" font-size="27" font-weight="bold">Application ≠ selection</text><text x="642" y="258" font-size="28" font-weight="bold">Paid professional access</text><text x="642" y="313" font-size="25">Check ticket / table / platform</text><text x="642" y="355" font-size="25">Confirm terms per attendee</text><text x="642" y="414" font-size="27" font-weight="bold">Price ≠ confirmed booking</text></g><text x="64" y="534" font-size="27" fill="white">Keep evidence. Name an owner. Resolve gaps before committing.</text><text x="64" y="580" font-size="21" fill="#8fd5c3">Rex editorial planning aid · Not an organizer form or admission guarantee</text></g></svg>
