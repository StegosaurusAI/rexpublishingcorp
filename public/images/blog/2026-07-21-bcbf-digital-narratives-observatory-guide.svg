<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Four modes of digital narrative engagement</title>
  <desc id="desc">Rex summary of the Digital Narratives Observatory framework: Media-Enhanced Reading, Traversing, Inhabiting and Co-Creating. These are overlapping modes, not quality rankings.</desc>
  <rect width="1200" height="630" fill="#102d3b"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="70" fill="white" font-size="20">REX PUBLISHING · FORMAT ADAPTATION</text>
    <text x="64" y="142" fill="white" font-size="42" font-weight="700">What will the reader do?</text>
    <text x="64" y="186" fill="#d9e8ed" font-size="24">Four modes from the 2026 Digital Narratives Observatory report.</text>
    <g fill="#f4f7f5">
      <rect x="64" y="242" width="520" height="128" rx="12"/>
      <rect x="616" y="242" width="520" height="128" rx="12"/>
      <rect x="64" y="402" width="520" height="128" rx="12"/>
      <rect x="616" y="402" width="520" height="128" rx="12"/>
    </g>
    <g fill="#102d3b">
      <text x="88" y="284" font-size="28" font-weight="700">Media-Enhanced Reading</text>
      <text x="88" y="330" font-size="22">Receive a story through new channels.</text>
      <text x="640" y="284" font-size="28" font-weight="700">Traversing</text>
      <text x="640" y="330" font-size="22">Choose among pre-designed paths.</text>
      <text x="88" y="444" font-size="28" font-weight="700">Inhabiting</text>
      <text x="88" y="490" font-size="22">Explore and assemble a story world.</text>
      <text x="640" y="444" font-size="28" font-weight="700">Co-Creating</text>
      <text x="640" y="490" font-size="22">Contribute material to the narrative.</text>
    </g>
    <text x="64" y="584" fill="#d9e8ed" font-size="20">Rex summary · Modes may overlap. More participation is not a quality ranking.</text>
  </g>
</svg>
