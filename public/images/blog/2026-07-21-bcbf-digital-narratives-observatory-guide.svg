<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Digital Narratives Observatory reader-agency matrix</title>
  <desc id="desc">A four-part diagram showing Media-Enhanced Reading, Traversing, Inhabiting, and Co-Creating arranged from lower to higher reader agency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="120" y="156" fill="#0f172a" font-family="Arial, sans-serif" font-size="54" font-weight="700">
    Digital narratives by reader agency
  </text>
  <text x="120" y="210" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Bologna's 2026 Observatory frame moves from receiving a story toward helping shape it
  </text>

  <g font-family="Arial, sans-serif">
    <rect x="120" y="312" width="280" height="280" rx="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <text x="155" y="386" fill="#0c4a6e" font-size="34" font-weight="700">Media-Enhanced</text>
    <text x="155" y="426" fill="#0c4a6e" font-size="34" font-weight="700">Reading</text>
    <text x="155" y="478" fill="#075985" font-size="24">Reader mainly receives</text>
    <text x="155" y="510" fill="#075985" font-size="24">the story with richer</text>
    <text x="155" y="542" fill="#075985" font-size="24">media support</text>

    <rect x="450" y="312" width="280" height="280" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="517" y="400" fill="#14532d" font-size="38" font-weight="700">Traversing</text>
    <text x="488" y="478" fill="#166534" font-size="24">Reader moves across</text>
    <text x="490" y="510" fill="#166534" font-size="24">linked narrative spaces</text>
    <text x="506" y="542" fill="#166534" font-size="24">and pathways</text>

    <rect x="780" y="312" width="280" height="280" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="855" y="400" fill="#78350f" font-size="38" font-weight="700">Inhabiting</text>
    <text x="834" y="478" fill="#92400e" font-size="24">Reader explores and</text>
    <text x="829" y="510" fill="#92400e" font-size="24">dwells inside a story</text>
    <text x="845" y="542" fill="#92400e" font-size="24">environment</text>

    <rect x="1110" y="312" width="320" height="280" rx="28" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="1185" y="400" fill="#7f1d1d" font-size="38" font-weight="700">Co-Creating</text>
    <text x="1162" y="478" fill="#991b1b" font-size="24">Reader helps shape or</text>
    <text x="1160" y="510" fill="#991b1b" font-size="24">extend the narrative</text>
    <text x="1172" y="542" fill="#991b1b" font-size="24">with the author</text>
  </g>

  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M400 452 H438"/>
    <path d="M730 452 H768"/>
    <path d="M1060 452 H1098"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="120" y="704" fill="#0f172a" font-size="34" font-weight="700">Reader agency increases from left to right</text>
    <text x="120" y="752" fill="#475569" font-size="28">Use the matrix before choosing rights scope, platform partners, and production complexity.</text>
  </g>
</svg>
