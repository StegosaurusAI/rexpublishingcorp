<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Leipzig Book Fair 2027 planning timeline</title>
  <desc id="desc">Timeline graphic showing Leipzig Book Fair 2027 planning dates from July 1, 2026 through March 21, 2027 with translation visibility and exhibitor deadlines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f3e8"/>
      <stop offset="100%" stop-color="#dce8ec"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b35c1e"/>
      <stop offset="100%" stop-color="#0f4c5c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="60" y="60" width="1480" height="780" rx="28" fill="#fffdf8" stroke="#d7c7a5" stroke-width="3"/>
  <text x="120" y="170" fill="#1f2a30" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">
    Leipzig Book Fair 2027
  </text>
  <text x="120" y="232" fill="#3f555d" font-family="Arial, Helvetica, sans-serif" font-size="32">
    Practical planning dates for translation-facing and exhibitor teams
  </text>

  <rect x="120" y="310" width="1360" height="18" rx="9" fill="url(#line)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="180" cy="319" r="18" fill="#b35c1e"/>
      <line x1="180" y1="337" x2="180" y2="430" stroke="#b35c1e" stroke-width="4"/>
      <text x="135" y="470" fill="#1f2a30" font-size="28" font-weight="700">Jul 1</text>
      <text x="110" y="505" fill="#485d64" font-size="24">Registration opens</text>
    </g>

    <g>
      <circle cx="380" cy="319" r="18" fill="#cf7b22"/>
      <line x1="380" y1="337" x2="380" y2="560" stroke="#cf7b22" stroke-width="4"/>
      <text x="320" y="600" fill="#1f2a30" font-size="28" font-weight="700">Aug 18</text>
      <text x="275" y="635" fill="#485d64" font-size="24">Special price ends</text>
      <text x="320" y="668" fill="#485d64" font-size="22">10% off stand rental</text>
    </g>

    <g>
      <circle cx="640" cy="319" r="18" fill="#0f4c5c"/>
      <line x1="640" y1="337" x2="640" y2="430" stroke="#0f4c5c" stroke-width="4"/>
      <text x="565" y="470" fill="#1f2a30" font-size="28" font-weight="700">Sep 15</text>
      <text x="500" y="505" fill="#485d64" font-size="24">Programme booking opens</text>
    </g>

    <g>
      <circle cx="930" cy="319" r="18" fill="#7d8f3c"/>
      <line x1="930" y1="337" x2="930" y2="560" stroke="#7d8f3c" stroke-width="4"/>
      <text x="855" y="600" fill="#1f2a30" font-size="28" font-weight="700">Nov 1</text>
      <text x="785" y="635" fill="#485d64" font-size="24">Exhibitor deadline</text>
    </g>

    <g>
      <circle cx="1150" cy="319" r="18" fill="#4d6a6d"/>
      <line x1="1150" y1="337" x2="1150" y2="430" stroke="#4d6a6d" stroke-width="4"/>
      <text x="1070" y="470" fill="#1f2a30" font-size="28" font-weight="700">Nov 30</text>
      <text x="1010" y="505" fill="#485d64" font-size="24">Programme deadline</text>
    </g>

    <g>
      <circle cx="1390" cy="319" r="24" fill="#17384d"/>
      <line x1="1390" y1="343" x2="1390" y2="560" stroke="#17384d" stroke-width="5"/>
      <text x="1270" y="600" fill="#1f2a30" font-size="28" font-weight="700">Mar 18-21, 2027</text>
      <text x="1265" y="635" fill="#485d64" font-size="24">Fair dates</text>
    </g>
  </g>

  <rect x="120" y="710" width="440" height="92" rx="18" fill="#f3ead7" stroke="#d7c7a5"/>
  <text x="150" y="754" fill="#1f2a30" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">
    Best fit
  </text>
  <text x="150" y="790" fill="#485d64" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Spring timing, translation visibility, trade traffic
  </text>

  <text x="1230" y="794" fill="#6b7e85" font-family="Arial, Helvetica, sans-serif" font-size="22">
    rexpublishingcorp.com
  </text>
</svg>
