<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Institut francais PAP workflow diagram</title>
  <desc id="desc">A workflow graphic showing the June 5 opening, September 8 closing, October 1 selection committee, French cultural network routing, and the excluded book categories for the 2026 PAP transfer-of-rights program.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="72" width="1472" height="756" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="118" y="164" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Institut francais PAP workflow
  </text>
  <text x="118" y="218" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    Route through the French cultural network before the September 8, 2026 close
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="296" width="290" height="186" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="152" y="360" fill="#1d4ed8" font-size="34" font-weight="700">1. Window is live</text>
    <text x="154" y="408" fill="#1e40af" font-size="24">Open: 5 June 2026</text>
    <text x="154" y="440" fill="#1e40af" font-size="24">Close: 8 September 2026</text>
    <text x="154" y="472" fill="#1e40af" font-size="24">Committee: 1 October 2026</text>

    <rect x="460" y="296" width="290" height="186" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="500" y="360" fill="#166534" font-size="34" font-weight="700">2. File locally</text>
    <text x="496" y="408" fill="#166534" font-size="24">Foreign publisher works</text>
    <text x="496" y="440" fill="#166534" font-size="24">through the French cultural</text>
    <text x="496" y="472" fill="#166534" font-size="24">network in-country</text>

    <rect x="802" y="296" width="290" height="186" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="844" y="360" fill="#92400e" font-size="34" font-weight="700">3. Prove fit</text>
    <text x="840" y="408" fill="#92400e" font-size="24">Market relevance,</text>
    <text x="840" y="440" fill="#92400e" font-size="24">translator quality, and</text>
    <text x="840" y="472" fill="#92400e" font-size="24">publisher profile matter</text>

    <rect x="1144" y="296" width="290" height="186" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1184" y="360" fill="#991b1b" font-size="34" font-weight="700">4. Exclude fast</text>
    <text x="1188" y="408" fill="#991b1b" font-size="24">No textbooks,</text>
    <text x="1188" y="440" fill="#991b1b" font-size="24">technical works, or</text>
    <text x="1188" y="472" fill="#991b1b" font-size="24">practical books</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M408 389 H444"/>
    <path d="M750 389 H786"/>
    <path d="M1092 389 H1128"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="560" width="1316" height="188" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="154" y="624" fill="#0f172a" font-size="34" font-weight="700">Keep PAP separate from other French grant routes</text>
    <text x="154" y="674" fill="#334155" font-size="28">PAP is a cultural-network-routed transfer-of-rights workflow</text>
    <text x="154" y="718" fill="#475569" font-size="24">Do not collapse it into the separate CNL translation-support path or treat it as a generic late-stage export subsidy.</text>
  </g>
</svg>
