<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Translating Europe Forum human accountability workflow chart</title>
  <desc id="desc">A Rex Publishing chart showing multilingual publishing tasks split between tool-accelerated work and named human accountability, with emphasis on meaning, tone, rights sensitivity, and publication readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f7f2" />
      <stop offset="100%" stop-color="#d9efe4" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#fffdf8" stroke="#0f766e" stroke-width="4" />
  <text x="120" y="155" fill="#0f172a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700">2026 Translating Europe Forum</text>
  <text x="120" y="205" fill="#115e59" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Human value in multilingual publishing is a workflow question, not a slogan.</text>

  <rect x="120" y="260" width="610" height="480" rx="28" fill="#ecfeff" stroke="#0891b2" stroke-width="3" />
  <text x="160" y="325" fill="#0c4a6e" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700">Tool-accelerated tasks</text>
  <text x="160" y="390" fill="#164e63" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">First-pass comparison</text>
  <text x="160" y="445" fill="#164e63" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Terminology checks</text>
  <text x="160" y="500" fill="#164e63" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Pattern spotting across drafts</text>
  <text x="160" y="555" fill="#164e63" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Internal routing and prep</text>
  <text x="160" y="640" fill="#155e75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25">Useful for speed, but not a substitute for release ownership.</text>

  <rect x="870" y="260" width="610" height="480" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
  <text x="910" y="325" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700">Named human accountability</text>
  <text x="910" y="390" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Final meaning and nuance</text>
  <text x="910" y="445" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Tone, persuasion, and transcreation</text>
  <text x="910" y="500" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Rights-sensitive wording</text>
  <text x="910" y="555" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28">Accessibility and public-facing trust</text>
  <text x="910" y="640" fill="#991b1b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25">If no one owns these, the workflow is fast but fragile.</text>

  <path d="M760 500 C815 500 815 500 840 500" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
  <polygon points="838,486 868,500 838,514" fill="#0f766e" />

  <text x="120" y="792" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Source context: DG Translation programme for the 11-13 November 2026 Translating Europe Forum.</text>
</svg>
