<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Frankfurt 2026 workstation planning diagram</title>
  <desc id="desc">A Rex-owned diagram showing public activity on the ground floor, business activity on upper levels, and a decision path from trade ticket to workstation or PRC-style meetings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe3"/>
      <stop offset="100%" stop-color="#dfe8f1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="90" y="120" width="1420" height="660" rx="32" fill="#fffaf2" stroke="#16324f" stroke-width="4"/>
  <text x="140" y="190" fill="#16324f" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700">
    Frankfurt 2026: buy a meeting base only if the week needs one
  </text>
  <text x="140" y="235" fill="#4d5f73" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Official 2026 fair pages point to a clearer split between public traffic and business workflow.
  </text>

  <rect x="140" y="290" width="610" height="180" rx="24" fill="#f3d9b1"/>
  <text x="180" y="345" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Ground floor</text>
  <text x="180" y="390" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="24">Public programme</text>
  <text x="180" y="425" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="24">Reader-facing traffic</text>

  <rect x="850" y="290" width="610" height="180" rx="24" fill="#c8ddee"/>
  <text x="890" y="345" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Upper levels</text>
  <text x="890" y="390" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="24">Business and networking</text>
  <text x="890" y="425" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="24">Professional programme and meetings</text>

  <path d="M800 505 L800 585" stroke="#16324f" stroke-width="5" stroke-dasharray="10 10"/>
  <circle cx="800" cy="505" r="14" fill="#16324f"/>

  <rect x="220" y="585" width="320" height="120" rx="22" fill="#ffffff" stroke="#16324f" stroke-width="3"/>
  <text x="260" y="635" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Ticket only</text>
  <text x="260" y="675" fill="#4d5f73" font-family="Arial, Helvetica, sans-serif" font-size="22">Best for lighter schedules</text>

  <rect x="640" y="555" width="320" height="150" rx="22" fill="#ffffff" stroke="#16324f" stroke-width="3"/>
  <text x="680" y="605" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Workstation</text>
  <text x="680" y="643" fill="#4d5f73" font-family="Arial, Helvetica, sans-serif" font-size="22">2 exhibitor passes</text>
  <text x="680" y="675" fill="#4d5f73" font-family="Arial, Helvetica, sans-serif" font-size="22">5 trade tickets per booked day</text>

  <rect x="1060" y="585" width="320" height="120" rx="22" fill="#ffffff" stroke="#16324f" stroke-width="3"/>
  <text x="1100" y="635" fill="#16324f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">PRC / specialist base</text>
  <text x="1100" y="675" fill="#4d5f73" font-family="Arial, Helvetica, sans-serif" font-size="22">Best for focused rights weeks</text>

  <path d="M540 645 L640 630" stroke="#16324f" stroke-width="4"/>
  <path d="M960 630 L1060 645" stroke="#16324f" stroke-width="4"/>

  <text x="140" y="760" fill="#4d5f73" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Core decision: meeting volume first, package second.
  </text>
</svg>
