<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Poland translation portal workflow checklist</title>
  <desc id="desc">A workflow graphic showing the order of account setup, contract preparation, translator details, distribution planning, and submission for the Poland translation programme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="60" y="70" width="1480" height="760" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="120" y="165" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">
    Poland 2026 translation portal workflow
  </text>
  <text x="120" y="220" fill="#475569" font-family="Arial, sans-serif" font-size="28">
    The portal is easiest when the project is already real before the login begins
  </text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="305" width="250" height="170" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
    <text x="155" y="370" fill="#1e3a8a" font-size="34" font-weight="700">1. Account</text>
    <text x="155" y="415" fill="#1d4ed8" font-size="24">Create the portal</text>
    <text x="155" y="447" fill="#1d4ed8" font-size="24">login and confirm</text>
    <text x="155" y="479" fill="#1d4ed8" font-size="24">the project lane</text>

    <rect x="410" y="305" width="250" height="170" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
    <text x="445" y="370" fill="#14532d" font-size="34" font-weight="700">2. Contracts</text>
    <text x="445" y="415" fill="#166534" font-size="24">Signed rights deal</text>
    <text x="445" y="447" fill="#166534" font-size="24">plus signed</text>
    <text x="445" y="479" fill="#166534" font-size="24">translator contract</text>

    <rect x="700" y="305" width="250" height="170" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="735" y="370" fill="#78350f" font-size="34" font-weight="700">3. Data</text>
    <text x="735" y="415" fill="#92400e" font-size="24">Author and translator</text>
    <text x="735" y="447" fill="#92400e" font-size="24">records, costs, and</text>
    <text x="735" y="479" fill="#92400e" font-size="24">edition details</text>

    <rect x="990" y="305" width="250" height="170" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="1025" y="370" fill="#7f1d1d" font-size="34" font-weight="700">4. Market plan</text>
    <text x="1025" y="415" fill="#991b1b" font-size="24">Promotion,</text>
    <text x="1025" y="447" fill="#991b1b" font-size="24">distribution, and</text>
    <text x="1025" y="479" fill="#991b1b" font-size="24">motivation field</text>

    <rect x="1280" y="305" width="180" height="170" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/>
    <text x="1315" y="370" fill="#4c1d95" font-size="34" font-weight="700">5. Submit</text>
    <text x="1315" y="415" fill="#5b21b6" font-size="24">File early</text>
    <text x="1315" y="447" fill="#5b21b6" font-size="24">enough to fix</text>
    <text x="1315" y="479" fill="#5b21b6" font-size="24">corrections</text>
  </g>
  <g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M370 390 H395"/>
    <path d="M660 390 H685"/>
    <path d="M950 390 H975"/>
    <path d="M1240 390 H1265"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="120" y="605" fill="#0f172a" font-size="34" font-weight="700">Live page checks to keep straight</text>
    <text x="120" y="660" fill="#334155" font-size="28">Current programme page lists the second 2026 call window as June 15 to September 15</text>
    <text x="120" y="715" fill="#334155" font-size="28">2026 priorities: Scandinavian languages and Italian</text>
    <text x="120" y="770" fill="#334155" font-size="28">Support can include translation, rights-license costs, and some illustrated-book print costs</text>
  </g>
</svg>
